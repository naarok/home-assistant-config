- id: '1785198909572'
  alias: Capture daily precipitation for 7-day sum
  triggers:
  - at: '23:59:00'
    trigger: time
  actions:
  - target:
      entity_id: input_text.precipitation_7_day_history
    data:
      value: "{% set history = (states('input_text.precipitation_7_day_history') |
        from_json)\n   if states('input_text.precipitation_7_day_history') not in
        ['unknown','unavailable',''] else [] %}\n{% set today = states('sensor.outside_area_pirateweather_edmonton_daily_precipitation')
        | float(0) %} {{ (history + [today])[-7:] | to_json }}\n"
    action: input_text.set_value
