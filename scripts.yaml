roborock_to_dock:
  sequence:
  - device_id: 4888007960e581adb77554d98983410c
    domain: vacuum
    entity_id: c14ec8c1bdae090bf4b0f3d1544b86e5
    type: dock
  alias: Roborock to dock
  description: ''
turn_on_samsung_65_tv:
  sequence:
  - target:
      entity_id: media_player.65_oled_3
    action: media_player.turn_on
turn_off_samsung_65_tv:
  sequence:
  - target:
      entity_id: media_player.65_oled_3
    action: media_player.turn_off
  alias: Turn off Samsung 65 TV
  description: ''
johns_shade_day:
  alias: John's Shade Day
  description: 'Set John''s Shade (bedroom) to the Day preset: bottom rail 16, middle
    rail 55.'
  sequence:
  - action: cover.set_cover_position
    target:
      entity_id: cover.bedroom_john_s_shade
    data:
      position: 16
  - action: cover.set_cover_tilt_position
    target:
      entity_id: cover.bedroom_john_s_shade
    data:
      tilt_position: 55
cathys_shade_day:
  alias: Cathy's Shade Day
  description: 'Set Cathy''s Shade (bedroom) to the Day preset: bottom rail 0, middle
    rail 65.'
  sequence:
  - action: cover.set_cover_position
    target:
      entity_id: cover.bedroom_cathy_s_shade
    data:
      position: 0
  - action: cover.set_cover_tilt_position
    target:
      entity_id: cover.bedroom_cathy_s_shade
    data:
      tilt_position: 65
office_shade_day:
  alias: Office Shade Day
  description: 'Set the Office Shade to the Day preset: bottom rail 75, middle rail
    0.'
  sequence:
  - action: cover.set_cover_position
    target:
      entity_id: cover.office_office_shade
    data:
      position: 75
  - action: cover.set_cover_tilt_position
    target:
      entity_id: cover.office_office_shade
    data:
      tilt_position: 0
bedroom_shades_day:
  alias: Bedroom Shades Day
  description: Set both bedroom shades (John's and Cathy's) to their Day presets.
  sequence:
  - action: script.turn_on
    target:
      entity_id:
      - script.johns_shade_day
      - script.cathys_shade_day
all_shades_day:
  alias: All Shades Day
  description: Set all three shades (John's, Cathy's, Office) to their Day presets.
  sequence:
  - action: script.turn_on
    target:
      entity_id:
      - script.johns_shade_day
      - script.cathys_shade_day
      - script.office_shade_day
